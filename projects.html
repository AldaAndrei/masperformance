<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proiecte | Mas Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1.3">
</head>
<body>

  <!-- PHP INCLUDE START: navbar -->
  <header class="navbar" style="background: rgba(10, 10, 10, 1);">
    <a href="index.html" class="logo"><img src="assets/images/MasPerformance.svg" alt="Mas Performance" class="logo-img"></a>
    <nav class="nav-links">
      <a href="index.html" data-lang-key="nav.home">Acasă</a>
      <a href="about.html" data-lang-key="nav.about">Despre Noi</a>
      <a href="projects.html" data-lang-key="nav.projects" class="text-accent">Proiecte</a>
      <a href="contact.html" data-lang-key="nav.contact">Contact</a>
    </nav>
    <div class="lang-switch">
      <span data-lang="ro" class="active">RO</span> | <span data-lang="en">EN</span>
    </div>
  </header>
  <!-- PHP INCLUDE END: navbar -->

  <div class="page-header">
    <h1><span data-lang-key="projects.title.1">Proiecte</span> <span class="text-accent" data-lang-key="projects.title.2">Recente</span></h1>
  </div>

  <section class="section">
    <div id="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem;">
      <!-- Dynamically populated via JS -->
    </div>
  </section>

  <!-- PHP INCLUDE START: footer -->
  <footer class="footer">
    <div class="footer-grid">
      <div><a href="index.html" class="logo footer-logo"><img src="assets/images/MasPerformance.svg" alt="Mas Performance" class="logo-img"></a></div>
    </div>
  </footer>
  <!-- PHP INCLUDE END: footer -->

  <!-- Project Photo Lightbox -->
  <div id="project-lightbox" class="modal-overlay">
    <div class="modal-content" style="max-width: 900px;">
      <button class="modal-close" aria-label="Close modal">&times;</button>
      <h3 id="lightbox-project-title" style="font-family: var(--font-heading); margin-bottom: 1.5rem; padding-right: 2rem;"></h3>

      <div class="gallery-carousel" id="lightbox-carousel" style="aspect-ratio: 16/9;">
        <div class="carousel-track" id="lightbox-carousel-track"></div>

        <button class="carousel-btn carousel-btn-prev" id="lightbox-carousel-prev" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="carousel-btn carousel-btn-next" id="lightbox-carousel-next" aria-label="Next slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <div class="carousel-dots" id="lightbox-carousel-dots"></div>
      </div>
    </div>
  </div>

  <script src="js/lang.js?v=1.3"></script>
  <script src="js/main.js?v=1.3"></script>
</body>
</html>
