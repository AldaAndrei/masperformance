<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html" class="active">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="projects.html">Projects</a>
      <a href="database.html">Database</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Contact Submissions</h1>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2 style="font-family: var(--font-heading); font-size:1.2rem;">All Submissions</h2>
          <button class="btn btn-outline btn-small">Export CSV</button>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Car</th>

              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subs-tbody">
            <!-- JS populated -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Submission Details Modal -->
  <div id="sub-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 600px; padding: 2rem; background: var(--surface-1); border: 1px solid var(--border-color); color: var(--text-primary);">
      <button class="modal-close" onclick="closeModal('sub-modal')" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; position: absolute; top: 1rem; right: 1rem;">&times;</button>
      <h2 style="font-family: var(--font-heading); font-size:1.4rem; margin-bottom: 1.5rem; color: var(--accent-color);">Submission Details</h2>
      
      <div id="sub-details-content" style="display: flex; flex-direction: column; gap: 1rem; font-size: 0.95rem; line-height: 1.6;">
        <!-- Dynamically populated -->
      </div>
      
      <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
        <button class="btn btn-primary" onclick="closeModal('sub-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
