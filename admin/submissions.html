<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo">MAS<span>PERF</span></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html" class="active">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="media.html">Media</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Contact Submissions</h1>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header">
          <h2 style="font-family: var(--font-heading); font-size:1.2rem;">All Submissions</h2>
          <button class="btn btn-outline btn-small">Export CSV</button>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Car</th>

              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="subs-tbody">
            <!-- JS populated -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
