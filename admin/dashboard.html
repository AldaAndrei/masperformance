<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"></div>
    <nav class="admin-nav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="submissions.html">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="media.html">Media</a>
      <a href="projects.html">Projects</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Dashboard Overview</h1>
      <a href="../index.html" target="_blank" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.8rem;">View Site ↗</a>
    </header>

    <div class="admin-content">
      
      <div class="dashboard-stats">
        <div class="admin-stat-card">
          <h3>Unread Submissions</h3>
          <div class="num text-accent" id="stat-unread">0</div>
        </div>
        <div class="admin-stat-card">
          <h3>Pending Reviews</h3>
          <div class="num text-accent" id="stat-pending">0</div>
        </div>
        <div class="admin-stat-card">
          <h3>Total Reviews</h3>
          <div class="num" id="stat-reviews">0</div>
        </div>

      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h2 style="font-family: var(--font-heading); font-size:1.2rem;">Recent Contact Submissions</h2>
          <a href="submissions.html" class="btn btn-outline btn-small">View All</a>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Car</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="dash-subs-tbody">
            <!-- JS populated -->
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
