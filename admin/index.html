<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Mas Performance</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="logo admin-logo" style="border:none; padding:0; text-align:center; margin-bottom: 2rem;"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"><br><span style="font-size:0.8rem; color:var(--text-muted); font-weight:400; letter-spacing:1px;">Admin Panel</span></div>
    
    <div id="login-err" style="display:none; color: var(--accent-color); text-align:center; margin-bottom: 1rem; font-size: 0.9rem;">Invalid credentials</div>

    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" value="admin" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" value="mas2025" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
      <a href="../index.html">← Back to Website</a>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
