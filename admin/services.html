<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css?v=1.3">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="projects.html">Projects</a>
      <a href="services.html" class="active">Services</a>
      <a href="media.html">Media</a>
      <a href="database.html">Database</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Services</h1>
      <button class="btn btn-primary" id="add-service-btn">Add Service</button>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Title (RO / EN)</th>
              <th>Description (RO / EN)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="services-tbody">
            <!-- JS populated -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Service Manage Modal -->
  <div id="service-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 650px; padding: 2rem; background: var(--surface-1); border: 1px solid var(--border-color); color: var(--text-primary);">
      <button class="modal-close" onclick="closeModal('service-modal')" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; position: absolute; top: 1rem; right: 1rem;">&times;</button>
      <h2 id="service-modal-title" style="font-family: var(--font-heading); font-size:1.4rem; margin-bottom: 1.5rem; color: var(--accent-color);">Manage Service</h2>

      <form id="service-form">
        <input type="hidden" id="service-id">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="service-title-ro">Title (Romanian)</label>
            <input type="text" id="service-title-ro" class="form-control" required placeholder="ex: Stage 1">
          </div>
          <div class="form-group">
            <label for="service-title-en">Title (English)</label>
            <input type="text" id="service-title-en" class="form-control" required placeholder="e.g. Stage 1">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="service-desc-ro">Description (Romanian)</label>
            <textarea id="service-desc-ro" class="form-control" style="min-height: 90px;" required placeholder="Descrierea serviciului în română"></textarea>
          </div>
          <div class="form-group">
            <label for="service-desc-en">Description (English)</label>
            <textarea id="service-desc-en" class="form-control" style="min-height: 90px;" required placeholder="Service description in English"></textarea>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline" onclick="closeModal('service-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" style="clip-path: none;">Save Service</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/admin.js?v=1.3"></script>
</body>
</html>
