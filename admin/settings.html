<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo">MAS<span>PERF</span></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="media.html">Media</a>
      <a href="settings.html" class="active">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Site Settings</h1>
      <button class="btn btn-primary" id="save-settings">Save Changes</button>
    </header>

    <div class="admin-content" style="max-width: 800px;">
      
      <div class="admin-card" style="padding: 2rem;">
        
        <div class="settings-section">
          <h3>Theme & Brand</h3>
          <div class="form-group">
            <label>Primary Accent Color</label>
            <div class="color-presets">
              <div class="color-btn" style="background:#d0021b;" data-color="#d0021b"></div>
              <div class="color-btn" style="background:#eab308;" data-color="#eab308"></div>
              <div class="color-btn" style="background:#22c55e;" data-color="#22c55e"></div>
              <div class="color-btn" style="background:#a855f7;" data-color="#a855f7"></div>
              <div class="color-btn" style="background:#3b82f6;" data-color="#3b82f6"></div>
            </div>
            <input type="color" id="custom-color" value="#d0021b" style="margin-top: 1rem;">
          </div>
        </div>

        <div class="settings-section">
          <h3>Homepage Hero</h3>
          <div class="form-group">
            <label>Hero Video URL (MP4)</label>
            <input type="text" class="form-control" value="assets/hero-bg.mp4">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label>Headline (RO)</label>
              <textarea class="form-control" style="min-height:80px;">Redefinește\nPuterea</textarea>
            </div>
            <div class="form-group">
              <label>Headline (EN)</label>
              <textarea class="form-control" style="min-height:80px;">Redefine\nPower</textarea>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3>Contact Information</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label>Phone</label>
              <input type="text" class="form-control" value="+40 700 000 000">
            </div>
            <div class="form-group">
              <label>WhatsApp Link</label>
              <input type="text" class="form-control" value="https://wa.me/40700000000">
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" value="contact@masperformance.ro">
          </div>
          <div class="form-group">
            <label>Address</label>
            <textarea class="form-control" style="min-height:80px;">Bulevardul Iuliu Maniu nr. 1, Sector 6, București</textarea>
          </div>
        </div>

        <div class="settings-section" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
          <h3>Social Media URLs</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label>Facebook</label>
              <input type="text" class="form-control" value="https://facebook.com">
            </div>
            <div class="form-group">
              <label>Instagram</label>
              <input type="text" class="form-control" value="https://instagram.com">
            </div>
            <div class="form-group">
              <label>YouTube</label>
              <input type="text" class="form-control" value="">
            </div>
            <div class="form-group">
              <label>TikTok</label>
              <input type="text" class="form-control" value="">
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
