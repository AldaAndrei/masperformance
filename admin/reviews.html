<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html">Submissions</a>
      <a href="reviews.html" class="active">Reviews</a>
      <a href="media.html">Media</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Customer Reviews</h1>
      <button class="btn btn-primary" onclick="alert('Add Review Modal')">Add Review</button>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Car</th>
              <th>Rating</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Andrei Popescu</td>
              <td>BMW F30 320d</td>
              <td style="color:var(--accent-color)">★★★★★</td>
              <td><span class="badge badge-success">Approved</span></td>
              <td>
                <button class="btn btn-outline btn-small">Edit</button>
                <button class="btn btn-primary btn-small">Del</button>
              </td>
            </tr>
            <tr>
              <td>Mihai Ionescu</td>
              <td>VW Golf 7 2.0 TDI</td>
              <td style="color:var(--accent-color)">★★★★★</td>
              <td><span class="badge badge-success">Approved</span></td>
              <td>
                <button class="btn btn-outline btn-small">Edit</button>
                <button class="btn btn-primary btn-small">Del</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
