<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="media.html" class="active">Media</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Media Library</h1>
    </header>

    <div class="admin-content">
      
      <!-- PHP CONVERSION NOTE: Handle $_FILES upload here -->
      <div class="drop-zone" onclick="alert('Open file picker')">
        <h3 style="font-family: var(--font-heading); margin-bottom: 0.5rem; color: var(--text-primary);">Drag & Drop images here</h3>
        <p>or click to browse</p>
      </div>

      <div class="admin-card" style="padding: 2rem;">
        <h2 style="font-family: var(--font-heading); font-size:1.2rem; margin-bottom: 1.5rem;">Uploaded Files</h2>
        
        <div class="media-grid">
          <div class="media-item">
            <img src="https://images.unsplash.com/photo-1555353540-64fd6b3e34b9?q=80&w=200&auto=format&fit=crop" alt="Media">
            <button class="delete-btn" onclick="alert('Delete image?')">×</button>
          </div>
          <div class="media-item">
            <img src="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=200&auto=format&fit=crop" alt="Media">
            <button class="delete-btn" onclick="alert('Delete image?')">×</button>
          </div>
          <div class="media-item">
            <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=200&auto=format&fit=crop" alt="Media">
            <button class="delete-btn" onclick="alert('Delete image?')">×</button>
          </div>
          <div class="media-item">
            <img src="https://images.unsplash.com/photo-1600705722908-bab1e61c0b4d?q=80&w=200&auto=format&fit=crop" alt="Media">
            <button class="delete-btn" onclick="alert('Delete image?')">×</button>
          </div>
          <div class="media-item">
            <img src="https://images.unsplash.com/photo-1611016186353-9af58c69a533?q=80&w=200&auto=format&fit=crop" alt="Media">
            <button class="delete-btn" onclick="alert('Delete image?')">×</button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
