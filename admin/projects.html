<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Mas Performance Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css?v=1.3">
</head>
<body>

  <!-- PHP INCLUDE: admin_sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo"><img src="../assets/images/MasPerformance.svg" alt="Mas Performance" style="height: 35px; width: auto; filter: drop-shadow(0 0 10px rgba(208, 2, 27, 0.5));"></div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="submissions.html">Submissions</a>
      <a href="reviews.html">Reviews</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="services.html">Services</a>
      <a href="media.html">Media</a>
      <a href="database.html">Database</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-logout">
      <a href="#" id="logout-btn" style="color:var(--text-muted); font-size:0.9rem;">Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1 style="font-family: var(--font-heading); font-size:1.5rem;">Project Management</h1>
      <button class="btn btn-primary" id="add-project-btn">Add Project</button>
    </header>

    <div class="admin-content">
      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Title</th>
              <th>Description (RO / EN)</th>
              <th>Stats (Stock / Tuned)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="projects-tbody">
            <!-- Dynamically populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Project Manage Modal -->
  <div id="project-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 700px;">
      <button class="modal-close" onclick="closeModal('project-modal')">&times;</button>
      <h2 id="modal-title" style="font-family: var(--font-heading); font-size:1.3rem; margin-bottom: 1.5rem;">Manage Project</h2>
      
      <form id="project-form">
        <input type="hidden" id="project-id">
        
        <div class="form-group">
          <label for="project-title">Project Title</label>
          <input type="text" id="project-title" class="form-control" placeholder="e.g. BMW M4 (F82)" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="project-desc-ro">Description (Romanian)</label>
            <textarea id="project-desc-ro" class="form-control" style="min-height: 80px;" placeholder="Descrierea proiectului în română" required></textarea>
          </div>
          <div class="form-group">
            <label for="project-desc-en">Description (English)</label>
            <textarea id="project-desc-en" class="form-control" style="min-height: 80px;" placeholder="Project description in English" required></textarea>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label for="project-stock">Stock Stats</label>
            <input type="text" id="project-stock" class="form-control" placeholder="e.g. 431 HP / 550 Nm" required>
          </div>
          <div class="form-group">
            <label for="project-tuned">Tuned Stats</label>
            <input type="text" id="project-tuned" class="form-control" placeholder="e.g. 540 HP / 750 Nm" required>
          </div>
        </div>

        <!-- Project Media upload inside Project modal -->
        <div class="form-group">
          <label style="display: block; margin-bottom: 0.5rem;">Project Images</label>

          <div class="drop-zone" id="project-img-drop-zone" style="padding: 1.5rem 1rem; margin-bottom: 0.75rem; border-width: 2px; border-style: dashed;">
            <h4 style="font-size: 0.85rem; margin-bottom: 0.25rem;">Drag images here</h4>
            <p style="font-size: 0.75rem;">or click to upload (multiple allowed)</p>
            <input type="file" id="project-img-file-input" accept="image/*" multiple style="display: none;">
          </div>

          <div id="project-img-url-form" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="url" id="project-img-url-input" class="form-control" placeholder="Or paste image URL here" style="padding: 0.5rem 0.75rem; font-size: 0.8rem;">
            <button type="button" id="project-img-url-add-btn" class="btn btn-outline btn-small" style="clip-path: none; flex-shrink: 0;">Add</button>
          </div>

          <div class="media-grid" id="project-img-grid" style="grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));"></div>
          <p id="project-img-empty" style="color: var(--text-muted); font-size: 0.8rem; display: none;">Nicio imagine adăugată încă.</p>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline" onclick="closeModal('project-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" style="clip-path: none;">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/admin.js?v=1.3"></script>
</body>
</html>
